name: Launcher

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test du coeur du launcher
        run: |
          set -o pipefail
          python -u tests/test_core.py 2>&1 | tee build.log
      - name: Publier le journal
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/logs && cp build.log /tmp/logs/build.log || echo "pas de log" > /tmp/logs/build.log
          cd /tmp/logs
          git init -q && git checkout -q -b logs
          git add . && git -c user.name=ci -c user.email=ci@example.com commit -qm "log ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "logs:refs/heads/logs-launcher-test"

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compiler le .exe
        shell: bash
        run: |
          set -o pipefail
          pip install pyinstaller 2>&1 | tail -2
          pyinstaller --onefile --noconsole --name Launcher launcher.py 2>&1 | tee build.log
          ls -l dist
          test "$(stat -c%s dist/Launcher.exe)" -gt 1000000
      - name: Publier dans les Releases
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete launcher-latest --yes --cleanup-tag || true
          gh release create launcher-latest dist/Launcher.exe admin.html --title "Launcher" --notes "Launcher.exe pour les joueurs, admin.html pour toi (${GITHUB_SHA})" --target "$GITHUB_SHA"
      - name: Publier le journal
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/logs && cp build.log /tmp/logs/build.log || echo "pas de log" > /tmp/logs/build.log
          cd /tmp/logs
          git init -q && git checkout -q -b logs
          git add . && git -c user.name=ci -c user.email=ci@example.com commit -qm "log ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "logs:refs/heads/logs-launcher-build"
